<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapFit</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
    }

    /* ===== TapFit WhatsApp Popup ===== */
    #tapfit-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 16px;
    }
    #tapfit-modal-overlay.show { display: flex; }

    #tapfit-modal {
      background: #fff;
      color: #1a1a1a;
      max-width: 420px;
      width: 100%;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      animation: tapfit-pop 0.3s ease;
    }
    @keyframes tapfit-pop {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    #tapfit-modal .tapfit-emoji { font-size: 44px; margin-bottom: 8px; }
    #tapfit-modal h2 { margin: 0 0 10px; font-size: 22px; line-height: 1.25; }
    #tapfit-modal p  { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: #444; }
    #tapfit-modal .tapfit-join {
      display: block;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 20px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    #tapfit-modal .tapfit-join:hover { background: #1ebe5b; }
    #tapfit-modal .tapfit-later {
      background: none;
      border: none;
      margin-top: 12px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
    #tapfit-modal .tapfit-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      font-size: 26px;
      line-height: 1;
      color: #888;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- ===== YOUR EXISTING PAGE CONTENT GOES HERE ===== -->
  <header style="padding:24px;text-align:center;">
    <h1>TapFit</h1>
  </header>
  <main style="padding:24px;max-width:800px;margin:auto;">
    <p>Welcome to TapFit.</p>
  </main>
  <!-- ================================================= -->

  <!-- TapFit WhatsApp Community Popup -->
  <div id="tapfit-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tapfit-title">
    <div id="tapfit-modal">
      <button class="tapfit-close" aria-label="Close">&times;</button>
      <div class="tapfit-emoji">🎁</div>
      <h2 id="tapfit-title">Join the Daily TapFit WhatsApp Community!</h2>
      <p>
        Stand a chance to <strong>win TikTok gifts and prizes every hour</strong>
        just for following and commenting. Join today for daily prizes!
      </p>
      <a class="tapfit-join"
         href="https://chat.whatsapp.com/CxHYdRtFsELL2daXTgN1a6"
         target="_blank" rel="noopener noreferrer">
        Join the Community Now
      </a>
      <button class="tapfit-later">Maybe later</button>
    </div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById('tapfit-modal-overlay');

      function openModal()  { overlay.classList.add('show'); }
      function closeModal() { overlay.classList.remove('show'); }

      // Shows on every page load
      window.addEventListener('load', function () { setTimeout(openModal, 500); });

      overlay.querySelector('.tapfit-close').addEventListener('click', closeModal);
      overlay.querySelector('.tapfit-later').addEventListener('click', closeModal);
      overlay.querySelector('.tapfit-join').addEventListener('click', closeModal);

      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    })();
  </script>

</body>
</html>
