
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ARMOR BREAK – Dragon Slayer Tap Game</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:dark;--bg:#060a14;--c:#3df2ff;--o:#ff6a2b;--y:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(ellipse at 50% 0%,#0f3a5c 0%,var(--bg) 62%)}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(61,242,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(61,242,255,.07) 1px,transparent 1px);background-size:36px 36px;transform:perspective(500px) rotateX(55deg) translateY(40%);transform-origin:bottom;pointer-events:none}
.card{background:rgba(10,20,40,.8);border:1px solid rgba(61,242,255,.35);backdrop-filter:blur(8px)}
.neon{text-shadow:0 0 12px var(--c)}
.zone{position:relative;perspective:700px}
#dragon{font-size:min(20vw,10vh,84px);line-height:1;filter:drop-shadow(0 0 16px rgba(255,106,43,.8));transition:transform .1s}
#dragon.hit{animation:hit .4s}
@keyframes hit{0%,100%{transform:translate(0);filter:brightness(1)}20%{transform:translate(-8px,0) scale(1.1);filter:brightness(3)}50%{transform:translate(8px,0)}80%{transform:translate(-4px,0)}}
#dragon.dead{animation:dead .6s forwards}
@keyframes dead{to{transform:translateY(60px) rotate(120deg) scale(.2);opacity:0}}
#hero{height:100%;max-height:min(40vh,300px);aspect-ratio:3/5;overflow:visible;transform-style:preserve-3d}
#heroWrap{height:100%;display:flex;align-items:center;justify-content:center}
#heroWrap.spin #hero{animation:spin 1.3s cubic-bezier(.5,0,.3,1)}
@keyframes spin{to{transform:rotateY(1080deg) scale(1.15)}}
#heroWrap.super #hero{filter:drop-shadow(0 0 18px var(--y))}
#hero .suit{fill:#1d4a8f;transition:fill .3s}
#heroWrap.super .suit{fill:#ffb800}
#hero .a{transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.3,1.4,.6,1),opacity .45s}
#hero .a.off{opacity:0;pointer-events:none}
#a1.off{transform:translate(-90px,-30px) rotate(-70deg)}
#a2.off{transform:translate(20px,-110px) rotate(50deg)}
#a3.off{transform:translate(0,-70px) rotate(40deg) scale(.6)}
#a4.off{transform:translate(0,90px) rotate(25deg) scale(.5)}
#a5.off{transform:translate(70px,60px) rotate(60deg)}
#a6.off{transform:translate(0,40px) scale(1.5)}
#cape2,#emb{opacity:0;transition:opacity .3s}
#heroWrap.super #cape2,#heroWrap.super #emb{opacity:1}
#beam{position:absolute;left:50%;width:22px;margin-left:-11px;bottom:34%;top:14%;border-radius:12px;background:linear-gradient(0deg,var(--y),#fff,var(--c));box-shadow:0 0 30px 10px rgba(61,242,255,.8);transform:scaleY(0);transform-origin:bottom;opacity:0;pointer-events:none}
#beam.go{animation:beam .55s ease-out}
@keyframes beam{0%{transform:scaleY(0);opacity:1}40%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1) scaleX(3);opacity:0}}
#btn{width:min(46vw,22vh,200px);aspect-ratio:1;border-radius:50%;border:0;position:relative;cursor:pointer;transform:rotateX(22deg);transition:transform .07s;background:none;padding:0;outline:0;transform-style:preserve-3d}
#btn .side,#btn .face{position:absolute;inset:0;border-radius:50%}
#btn .side{background:#8a3410;transform:translateZ(-14px);box-shadow:0 0 0 2px #4a1b08,0 26px 36px rgba(255,106,43,.35)}
#btn .face{background:radial-gradient(circle at 35% 28%,#ffd0b0,var(--o) 45%,#c63d0b 100%);display:flex;align-items:center;justify-content:center;font-size:min(20vw,10vh,90px);box-shadow:inset 0 -10px 25px rgba(0,0,0,.35),inset 0 8px 18px rgba(255,255,255,.5)}
#btn.press{transform:rotateX(22deg) translateZ(-12px) scale(.95)}
#btn.hot .face{animation:pulse .25s infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 -10px 25px rgba(0,0,0,.35),inset 0 8px 18px rgba(255,255,255,.5),0 0 60px 12px rgba(61,242,255,.8)}}
.pop{position:fixed;pointer-events:none;font-weight:900;color:var(--y);text-shadow:0 0 8px #000;animation:up .7s ease-out forwards;z-index:20}
@keyframes up{to{transform:translateY(-110px) scale(1.4);opacity:0}}
.fly{position:fixed;pointer-events:none;z-index:15;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}
.shake{animation:shake .12s infinite}
@media (prefers-reduced-motion:reduce){#heroWrap.spin #hero{animation-duration:.01s}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<main class="relative h-full max-w-md mx-auto flex flex-col px-4 py-3 gap-2">
  <header class="flex items-center justify-between">
    <div class="font-black text-xl neon tracking-wider">ARMOR<span style="color:var(--o)">BREAK</span> ⚔️</div>
    <div class="text-right text-xs text-white/70">Daily best<br><b id="best" class="text-lg" style="color:var(--y)">0</b></div>
  </header>

  <section class="grid grid-cols-3 gap-2 text-center">
    <div class="card rounded-xl py-1"><div class="text-[10px] text-white/60">TIME</div><div id="time" class="text-2xl font-black">2:30</div></div>
    <div class="card rounded-xl py-1"><div class="text-[10px] text-white/60">DRAGONS SLAIN</div><div id="slain" class="text-2xl font-black" style="color:var(--o)">0</div></div>
    <div class="card rounded-xl py-1"><div class="text-[10px] text-white/60">TAPS/SEC</div><div id="tps" class="text-2xl font-black" style="color:var(--c)">0.0</div></div>
  </section>

  <div class="card rounded-full h-3 overflow-hidden"><div id="bar" class="h-full w-0" style="background:linear-gradient(90deg,var(--c),var(--y),var(--o));transition:width .1s"></div></div>
  <div class="flex justify-between text-xs"><span id="tier" class="font-bold">🛡️ HEAVY KNIGHT</span><span id="pw" class="font-bold" style="color:var(--y)">Power 0%</span></div>

  <div class="zone flex-1 min-h-0 flex flex-col items-center">
    <div class="text-center">
      <div id="dragon">🐉</div>
      <div class="card rounded-full h-2 w-28 mx-auto mt-1 overflow-hidden"><div id="hp" class="h-full" style="width:100%;background:#ff3d4e;transition:width .3s"></div></div>
    </div>
    <div id="beam"></div>
    <div id="heroWrap" class="flex-1 min-h-0 w-full">
      <svg id="hero" viewBox="0 0 120 200" aria-label="Hero">
        <g id="a6" class="a"><path d="M36 66 L84 66 L100 178 L20 178Z" fill="#6b4a2f" stroke="#3b2713" stroke-width="2"/></g>
        <path id="cape2" d="M36 66 L84 66 L104 186 L16 186Z" fill="#e0243a"/>
        <rect class="suit" x="44" y="118" width="14" height="64" rx="6"/><rect class="suit" x="62" y="118" width="14" height="64" rx="6"/>
        <rect x="42" y="176" width="18" height="12" rx="5" fill="#222"/><rect x="60" y="176" width="18" height="12" rx="5" fill="#222"/>
        <rect class="suit" x="22" y="68" width="14" height="50" rx="7"/><rect class="suit" x="84" y="68" width="14" height="50" rx="7"/>
        <rect class="suit" x="38" y="64" width="44" height="62" rx="10"/>
        <text id="emb" x="60" y="104" text-anchor="middle" font-size="30">⚡</text>
        <circle cx="60" cy="40" r="17" fill="#f1c27d"/>
        <circle cx="54" cy="40" r="2" fill="#222"/><circle cx="66" cy="40" r="2" fill="#222"/>
        <path d="M53 47 q7 6 14 0" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
        <g id="a5" class="a"><rect x="42" y="146" width="18" height="34" rx="6" fill="#8fa3b8" stroke="#4d5d6e" stroke-width="2"/><rect x="60" y="146" width="18" height="34" rx="6" fill="#8fa3b8" stroke="#4d5d6e" stroke-width="2"/></g>
        <g id="a4" class="a"><rect x="36" y="64" width="48" height="56" rx="9" fill="#a9bacb" stroke="#4d5d6e" stroke-width="2"/><path d="M60 68 V116 M42 90 H78" stroke="#4d5d6e" stroke-width="2"/></g>
        <g id="a3" class="a"><circle cx="30" cy="72" r="12" fill="#8fa3b8" stroke="#4d5d6e" stroke-width="2"/><circle cx="90" cy="72" r="12" fill="#8fa3b8" stroke="#4d5d6e" stroke-width="2"/></g>
        <g id="a2" class="a"><path d="M41 42 a19 19 0 0 1 38 0 v8 h-38z" fill="#a9bacb" stroke="#4d5d6e" stroke-width="2"/><rect x="48" y="38" width="24" height="5" fill="#1b2430"/><rect x="57" y="14" width="6" height="14" rx="3" fill="#e0243a"/></g>
        <g id="a1" class="a"><path d="M2 88 h26 v24 q0 18 -13 24 q-13 -6 -13 -24z" fill="#3d6fb0" stroke="#1d3a66" stroke-width="2.5"/><path d="M15 94 v36 M6 110 h18" stroke="#ffd23f" stroke-width="3"/></g>
      </svg>
    </div>
  </div>

  <div class="flex items-center justify-center" style="perspective:700px;height:min(27vh,230px)">
    <button id="btn" aria-label="Tap"><span class="side"></span><span class="face">⚡</span></button>
  </div>

  <p id="hint" class="text-center text-xs text-white/60 pb-1">Tap the bolt to shed armor. Reach full power to transform and strike the dragon. You have 2:30.</p>
</main>

<div id="over" class="fixed inset-0 z-30 hidden items-center justify-center p-5" style="background:rgba(6,10,20,.92)">
  <div class="card rounded-2xl p-6 w-full max-w-sm text-center">
    <div class="text-5xl mb-1" id="oEmoji">🛡️</div>
    <h2 class="text-2xl font-black neon">TIME’S UP!</h2>
    <div class="text-6xl font-black my-2" id="oScore" style="color:var(--y)">0</div>
    <div class="text-sm text-white/70" id="oStats"></div>
    <div class="text-sm text-white/70 mt-1" id="oMsg"></div>
    <input id="name" maxlength="14" placeholder="Your hero name" class="mt-4 w-full rounded-lg bg-black/40 border border-white/20 px-3 py-2 text-center outline-none focus:border-cyan-300">
    <div class="mt-4 text-left text-xs text-white/70"><div class="font-bold mb-1" style="color:var(--c)">🏆 Today’s leaderboard (this device)</div><ol id="lb" class="space-y-1"></ol></div>
    <button id="again" class="mt-5 w-full rounded-xl py-3 font-black text-black text-lg" style="background:linear-gradient(90deg,var(--c),var(--y))">Play again</button>
    <button id="share" class="mt-2 w-full rounded-xl py-2 font-bold border border-white/25">Share score</button>
  </div>
</div>

<script>
(function(){
var DUR=150,PIECES=6,DRAGONS=['🐉','🐲','🦖','👹','🦂'],
TIERS=[{n:'🛡️ HEAVY KNIGHT',t:0,g:1},{n:'🏃 LIGHT RUNNER',t:3,g:1},{n:'⚡ SPEEDSTER',t:6,g:2},{n:'🔥 OVERDRIVE',t:10,g:3}];
var $=function(i){return document.getElementById(i)};
var btn=$('btn'),wrap=$('heroWrap'),dragon=$('dragon'),beam=$('beam');
var running=false,busy=false,end=0,stamps=[],tick=null,taps=0,power=0,need=40,hp=3,slain=0,blasts=0,tier=0,dIdx=0;
var today=new Date().toISOString().slice(0,10),KEY='armorbreak:'+today;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function best(){var a=load();return a.length?a[0].s:0}
function total(){return taps+blasts*150+slain*500}
$('best').textContent=best();
try{$('name').value=localStorage.getItem('armorbreak:name')||''}catch(e){}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tps(){var n=performance.now();stamps=stamps.filter(function(t){return n-t<2000});return stamps.length/2}
function beep(f){try{var c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='square';g.gain.value=.03;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.06)}catch(e){}}
function pop(t,x,y,big){var p=document.createElement('div');p.className='pop';p.textContent=t;if(big)p.style.fontSize='28px';p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);setTimeout(function(){p.remove()},700)}
function setArmor(n){for(var i=1;i<=PIECES;i++){var el=$('a'+i);if(i<=n)el.classList.add('off');else el.classList.remove('off')}}
function setHp(){$('hp').style.width=(hp/3*100)+'%'}

function start(){
  taps=0;power=0;need=40;hp=3;slain=0;blasts=0;tier=0;dIdx=0;stamps=[];busy=false;running=true;
  end=performance.now()+DUR*1000;setArmor(0);setHp();dragon.textContent=DRAGONS[0];dragon.className='';
  $('hint').textContent='Shed every piece! Faster taps charge power faster.';
  clearInterval(tick);tick=setInterval(update,100);
}
function update(){
  var left=(end-performance.now())/1000;$('time').textContent=fmt(left);
  var r=tps();$('tps').textContent=r.toFixed(1);
  var ti=0;for(var i=0;i<TIERS.length;i++)if(r>=TIERS[i].t)ti=i;
  if(ti!==tier){tier=ti;$('tier').textContent=TIERS[ti].n;beep(300+ti*140)}
  btn.classList.toggle('hot',r>=6&&!busy);
  document.body.classList.toggle('shake',r>=10&&!busy);
  if(left<=0)finish();
}
function render(){
  var pc=Math.min(100,Math.round(power/need*100));
  $('bar').style.width=pc+'%';$('pw').textContent='Power '+pc+'%';
  setArmor(Math.min(PIECES,Math.floor(power/need*(PIECES+1))));
}
function tap(x,y){
  if(!running){if(btn.dataset.lock)return;start()}
  if(busy)return;
  var r=tps();stamps.push(performance.now());taps++;
  power+=TIERS[tier].g;
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  pop('+'+TIERS[tier].g,x-8+(Math.random()*40-20),y-30);
  if(taps%5===0||r>=6){var f=document.createElement('div');f.className='fly';f.textContent=['🔩','⚙️','✨'][Math.floor(Math.random()*3)];f.style.fontSize=(18+Math.random()*20)+'px';f.style.left=x+'px';f.style.top=y+'px';f.style.setProperty('--x',(Math.random()*240-120)+'px');f.style.setProperty('--y',-(80+Math.random()*200)+'px');f.style.setProperty('--r',(Math.random()*720-360)+'deg');document.body.appendChild(f);setTimeout(function(){f.remove()},900)}
  render();
  if(power>=need)transform();
}
// Full power: spin, change into the super suit, strike, then armor back on.
function transform(){
  busy=true;btn.classList.remove('hot');document.body.classList.remove('shake');
  $('hint').textContent='FULL POWER! Transforming…';beep(520);
  wrap.classList.add('spin');
  setTimeout(function(){wrap.classList.add('super');beep(760)},500);
  setTimeout(function(){
    beam.classList.remove('go');void beam.offsetWidth;beam.classList.add('go');
    dragon.classList.remove('hit');void dragon.offsetWidth;dragon.classList.add('hit');
    blasts++;hp--;setHp();beep(980);
    var b=btn.getBoundingClientRect();pop('POWER STRIKE! +150',b.left+b.width/2-70,b.top-80,true);
    if(hp<=0){slain++;$('slain').textContent=slain;pop('DRAGON SLAIN! +500',b.left+b.width/2-90,b.top-120,true);dragon.className='dead';
      setTimeout(function(){dIdx=(dIdx+1)%DRAGONS.length;dragon.textContent=DRAGONS[dIdx];dragon.className='';hp=3;setHp()},650)}
  },1300);
  setTimeout(function(){
    wrap.classList.remove('spin','super');
    power=0;need=40+blasts*4;setArmor(0);render();
    busy=false;$('hint').textContent='Armor back on. Shed it again, faster!';
  },2300);
}
function finish(){
  running=false;busy=false;clearInterval(tick);document.body.classList.remove('shake');btn.classList.remove('hot');
  wrap.classList.remove('spin','super');
  btn.dataset.lock='1';setTimeout(function(){delete btn.dataset.lock},900);
  var prev=best(),sc=total();
  $('oScore').textContent=sc;
  $('oEmoji').textContent=slain>=5?'👑':slain>=3?'🏆':slain>=1?'⚔️':'🛡️';
  $('oStats').textContent=taps+' taps · '+blasts+' power strikes · '+slain+' dragons slain';
  $('oMsg').textContent=sc>prev?'🔥 New daily best! You lead the tournament.':'Daily best to beat: '+prev;
  var a=load();a.push({n:$('name').value.trim().slice(0,14)||'You',s:sc,id:Date.now()});a.sort(function(x,y){return y.s-x.s});a=a.slice(0,10);save(a);
  renderLB();$('over').style.display='flex';beep(880);
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function renderLB(){
  var a=load(),h='';
  a.slice(0,5).forEach(function(r,i){h+='<li class="flex justify-between"><span>'+(['🥇','🥈','🥉','4.','5.'][i])+' '+esc(r.n)+'</span><b style="color:var(--y)">'+r.s+'</b></li>'});
  $('lb').innerHTML=h||'<li>No scores yet</li>';
}
$('name').addEventListener('input',function(){
  var v=this.value.trim().slice(0,14)||'You';
  try{localStorage.setItem('armorbreak:name',v)}catch(e){}
  var a=load(),latest=a.reduce(function(m,r){return !m||r.id>m.id?r:m},null);
  if(latest){latest.n=v;save(a);renderLB()}
});
$('again').onclick=function(){
  $('over').style.display='none';$('best').textContent=best();
  $('slain').textContent='0';$('time').textContent='2:30';$('tps').textContent='0.0';$('bar').style.width='0';$('pw').textContent='Power 0%';
  $('tier').textContent=TIERS[0].n;setArmor(0);hp=3;setHp();dragon.textContent=DRAGONS[0];dragon.className='';
  $('hint').textContent='Tap the bolt to start your 2:30 run.'};
$('share').onclick=function(){
  var t='I slew '+slain+' dragons and scored '+total()+' in 2:30 on ARMOR BREAK ⚔️ Can you beat me?';
  if(navigator.share){navigator.share({title:'ARMOR BREAK',text:t,url:location.href}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(t+' '+location.href).then(function(){$('share').textContent='Copied!'}).catch(function(){})}
};
btn.addEventListener('pointerdown',function(e){e.preventDefault();btn.classList.add('press');tap(e.clientX,e.clientY)});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){btn.addEventListener(ev,function(){btn.classList.remove('press')})});
btn.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('keydown',function(e){if(e.code==='Space'&&!e.repeat){e.preventDefault();btn.classList.add('press');var b=btn.getBoundingClientRect();tap(b.left+b.width/2,b.top+b.height/2)}});
document.addEventListener('keyup',function(e){if(e.code==='Space')btn.classList.remove('press')});
document.addEventListener('gesturestart',function(e){e.preventDefault()});
})();
</script>
</body>
</html>
